<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8">
  <!--
    CSP — delta vs the vanilla app (style-src changes only):

    - style-src-attr 'unsafe-inline' (NEW): React writes presentation via
      style="" attributes, and mermaid emits style attributes inside its SVG
      output. Both are attribute styles, so they get their own narrow
      directive instead of a blanket style-src allowance.
    - style-src keeps 'unsafe-inline': two inline element styles still need it —
      the Vite dev server injects <style> tags for HMR, and mermaid embeds
      <style> inside its SVGs at runtime. Production CSS itself ships as a
      bundled <link> ('self'); once mermaid styling moves into bundled CSS,
      'unsafe-inline' can be dropped from style-src entirely.
    - script-src 'self' is unchanged. `pnpm dev` alone relaxes it (React Fast
      Refresh injects an inline module preamble); see
      relaxCspForDevServer() in vite.config.ts. Production stays strict — the
      e2e boot spec asserts no console errors against this exact policy.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src-attr 'unsafe-inline'; font-src https://cdn.jsdelivr.net; img-src * data:; media-src * data:; connect-src *; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qalam — collaborative Markdown editor</title>
  <meta name="description" content="Qalam (قلم): a collaborative Markdown editor where humans and AI write together — on-device AI (Gemini Nano) or your own OpenAI/Anthropic-compatible service. Persian/RTL-first, Mermaid diagrams, self-contained share links.">
  <meta name="theme-color" content="#0969da">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230969da'/%3E%3Cpath d='M32 10c-7 7-13 15-13 22.5C19 40 25 46.5 32 46.5S45 40 45 32.5C45 25 39 17 32 10Z' fill='none' stroke='white' stroke-width='3.5' stroke-linejoin='round'/%3E%3Cpath d='M32 15v20' stroke='white' stroke-width='3.5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='40.5' r='3.5' fill='white'/%3E%3C/svg%3E">

  <!-- Pre-paint boot: restores theme/lang/dir from storage before first paint -->
  <script src="./boot.js"></script>

  <!-- Persian UI font (falls through to it from the --sans token stack) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" crossorigin="anonymous">
</head>
<body>
  <!-- React mounts here; ?file= / ?url= / #d= document loading is handled
       inside the app (no routing layer) -->
  <div id="root"></div>
  <noscript><p>Qalam requires JavaScript / قلم به جاوااسکریپت نیاز دارد.</p></noscript>

  <!-- App entry -->
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
